version: 2

models:
  - name: stg_walmart_sales
    description: "Grain: one cleaned sale record per transaction_id after deduplication. The current source has one product line per transaction."
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: transaction_timestamp
        data_tests: [not_null]
      - name: unit_price
        data_tests: [not_null]
      - name: customer_age
        description: "Null only when missing in the raw data and the customer has no other transaction to impute from"
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: category
        data_tests:
          - accepted_values:
              values: ['Electronics', 'Appliances']
      - name: store_location
        data_tests:
          - accepted_values:
              values: ['New York, NY', 'Los Angeles, CA', 'Chicago, IL', 'Dallas, TX', 'Miami, FL']
      - name: customer_gender
        data_tests:
          - accepted_values:
              values: ['Male', 'Female', 'Other', 'Unknown']
      - name: customer_loyalty_level
        data_tests:
          - accepted_values:
              values: ['Bronze', 'Silver', 'Gold', 'Platinum']
      - name: payment_method
        data_tests:
          - accepted_values:
              values: ['Credit Card', 'Debit Card', 'Cash', 'Digital Wallet']
      - name: promotion_type
        data_tests:
          - accepted_values:
              values: ['No Promotion', 'BOGO', 'Percentage Discount']
      - name: weather_conditions
        data_tests:
          - accepted_values:
              values: ['Sunny', 'Cloudy', 'Rainy', 'Stormy']
      - name: promotion_applied
        data_tests: [not_null]
      - name: holiday_indicator
        data_tests: [not_null]
      - name: stockout_indicator
        data_tests: [not_null]

  - name: dim_product
    description: "Grain: one distinct (product_id, product_name, category) member, identified by product_key."
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null
      - name: product_id
        data_tests:
          - not_null

  - name: dim_customer
    description: "Grain: one customer_id and version_number (SCD Type 2), identified by customer_key, valid over [valid_from, valid_to). Tracked attribute changes create versions."
    columns:
      - name: customer_key
        description: "Surrogate key per customer version"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: version_number
        data_tests:
          - not_null
      - name: valid_from
        description: "Version start (inclusive); first version starts 1900-01-01"
        data_tests:
          - not_null
      - name: valid_to
        description: "Version end (exclusive); null for the current version"
      - name: is_current
        data_tests:
          - not_null

  - name: dim_store
    description: "Grain: one distinct (store_id, store_location) member, identified by store_key. Several stores can share a location."
    columns:
      - name: store_key
        data_tests:
          - unique
          - not_null
      - name: store_id
        data_tests:
          - not_null

  - name: dim_supplier
    description: "Grain: one distinct (supplier_id, supplier_lead_time) member, identified by supplier_key."
    columns:
      - name: supplier_key
        data_tests:
          - unique
          - not_null
      - name: supplier_id
        data_tests:
          - not_null

  - name: dim_date
    description: "Grain: one calendar date present in the cleaned sales source, identified by date_key; not a complete date spine for periods without sales."
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null
      - name: full_date
        data_tests:
          - not_null

  - name: fct_walmart_sales
    description: "Grain: one sales line identified by sales_key (transaction_id, product_id, transaction_timestamp). Current source has one line per transaction. Inventory and demand values are observations attached to sales, not independent daily snapshots."
    columns:
      - name: sales_key
        data_tests:
          - unique
          - not_null
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: store_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_store')
              field: store_key
      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

  - name: m01_sales_performance
    description: "Grain: one (year, month_name, category, store_location, holiday_indicator, promotion_type) group. Location aggregates several stores; AOV is non-additive."
    columns:
      - name: year
        data_tests: [not_null]
      - name: month_name
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
      - name: store_location
        data_tests: [not_null]
      - name: total_transactions
        data_tests: [not_null]
      - name: total_revenue
        data_tests: [not_null]

  - name: m02_customer_intelligence
    description: "Grain: one (customer_loyalty_level, customer_gender, payment_method, store_location) group over all source dates. Distinct customers cannot be summed across groups; AOV and average income are non-additive."
    columns:
      - name: customer_loyalty_level
        data_tests: [not_null]
      - name: payment_method
        data_tests: [not_null]
      - name: store_location
        data_tests: [not_null]
      - name: unique_customers
        data_tests: [not_null]
      - name: total_spent
        data_tests: [not_null]

  - name: m03_inventory_risk
    description: "Grain: one (store_location, category, weather_conditions) group over all source dates. Rates and averages are weighted by sale records, not independent daily inventory events."
    columns:
      - name: store_location
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
      - name: total_events
        data_tests: [not_null]
      - name: stockout_rate_pct
        data_tests: [not_null]

  - name: m04_loyalty_upgrade_impact
    description: "Grain: one (from_tier, to_tier) group of customer version transitions. Post-upgrade spend per 30 days is compared with stable customers over the same window; uplift and rates are non-additive."
    columns:
      - name: from_tier
        data_tests: [not_null]
      - name: to_tier
        data_tests: [not_null]
      - name: upgraded_customers
        data_tests: [not_null]
      - name: uplift_vs_control
        data_tests: [not_null]


  - name: smt_sales_summary
    description: >-
      Grain: one grouping_id plus retained (year, quarter, month_number,
      store_location, category) combination. ROLLUP creates month/quarter/year/all_time
      levels crossed with CUBE location_category/location/category/all_dimensions.
      Omitted dimensions are NULL, distinguished from actual NULL by grouping_id.
      Select one time_grain and dimension_grain before aggregating. AOV and distinct
      transaction counts are computed directly from fact at each level; do not average AOV.
    columns:
      - name: summary_key
        description: "Hash of grouping_id and all five dimension values, including explicit nulls."
        data_tests: [unique, not_null]
      - name: grouping_id
        description: "GROUPING(year, quarter, month_number, store_location, category); 31 is the grand total."
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6, 7, 12, 13, 14, 15, 28, 29, 30, 31]
              quote: false
      - name: time_grain
        data_tests:
          - not_null
          - accepted_values:
              values: ['month', 'quarter', 'year', 'all_time']
      - name: dimension_grain
        data_tests:
          - not_null
          - accepted_values:
              values: ['location_category', 'location', 'category', 'all_dimensions']
      - name: year
        description: "Calendar year; omitted (NULL) at all_time level."
      - name: quarter
        description: "Quarter number within year; omitted at year/all_time levels."
      - name: month_number
        description: "Month 1-12 within year/quarter; retained only at month level."
      - name: store_location
        description: "City/location, not store_id; omitted at category/all_dimensions levels."
      - name: category
        description: "Product category; omitted at location/all_dimensions levels."
      - name: total_transactions
        description: "Distinct transaction_id within this row's grain. Recount from fact if combining groups with multi-line bills."
        data_tests: [not_null]
      - name: total_units_sold
        data_tests: [not_null]
      - name: total_revenue
        data_tests: [not_null]
      - name: aov
        description: "Revenue divided by distinct transactions at this grain; NULL when there are no transactions."
